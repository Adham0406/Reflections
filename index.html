<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 2 Q56 44 98 50 Q56 56 50 98 Q44 56 2 50 Q44 44 50 2Z' fill='%23ffd6e3'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Reflections — Lyric Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@500;700&family=Playfair+Display:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
  :root { --ui: rgba(255,255,255,.85); --ui-dim: rgba(255,255,255,.45); --accent: #ff7fb0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ui); overflow: hidden;
    font-family: Inter, system-ui, sans-serif; overscroll-behavior: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  textarea { -webkit-user-select: text; user-select: text; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: radial-gradient(ellipse at center, #1a0b2e 0%, #05030a 70%); z-index: 10; text-align: center; padding: 16px; }
  #start h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(48px, 11vw, 150px); margin: 0;
    letter-spacing: .02em; color: #ffd6e3; text-shadow: 0 0 40px rgba(255,95,162,.45); line-height: .95; }
  #start h2 { margin: 0; font-weight: 500; letter-spacing: .35em; text-transform: uppercase; font-size: 13px; color: var(--ui-dim); }
  #play { margin-top: 10px; font: 700 16px Inter, sans-serif; color: #12051f; background: #ffd6e3; border: 0; border-radius: 999px;
    padding: 16px 38px; cursor: pointer; letter-spacing: .08em; box-shadow: 0 0 30px rgba(255,95,162,.5); transition: transform .15s; }
  #play:hover { transform: scale(1.05); }
  #play:disabled { opacity: .5; cursor: wait; }
  #status { font-size: 13px; color: var(--ui-dim); min-height: 1.2em; max-width: 560px; }
  #status b { color: var(--ui); }
  .hint { font-size: 12px; color: rgba(255,255,255,.35); max-width: 560px; line-height: 1.6; }
  #pasteWrap { display: none; flex-direction: column; gap: 8px; width: min(560px, 100%); }
  #pasteWrap textarea { width: 100%; height: 160px; background: rgba(255,255,255,.06); color: #fff; border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px; padding: 10px; font: 12px ui-monospace, Consolas, monospace; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.65)); z-index: 5; transition: opacity .4s; font-size: 12px; }
  #hud.hide { opacity: 0; pointer-events: none; }
  #hud button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; font: 600 12px Inter, sans-serif; }
  #bar { flex: 1; min-width: 60px; height: 4px; background: rgba(255,255,255,.18); border-radius: 4px; cursor: pointer; position: relative; }
  #bar::before { content: ''; position: absolute; left: 0; right: 0; top: -14px; bottom: -14px; } /* bigger touch target */
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: 4px; }
  #sec { min-width: 92px; text-transform: uppercase; letter-spacing: .2em; color: var(--ui-dim); }
  .sync { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  #time { white-space: nowrap; }
  #drop { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; font: 700 22px Inter;
    background: rgba(20,5,30,.85); border: 3px dashed var(--accent); }
  @media (max-width: 700px) {
    #sec, #vert { display: none; }
    #hud { gap: 8px; font-size: 11px; }
    #hud button { padding: 9px 11px; font-size: 13px; }
    #start .hint { font-size: 11px; }
    #play { padding: 18px 44px; }
  }
  @media (max-width: 380px) { #time { display: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="start">
  <h2>The Neighbourhood</h2>
  <h1>REFLECTIONS</h1>
  <div id="status">Matn yuklanmoqda…</div>
  <button id="play" disabled>▶ BOSHLASH</button>
</div>

<div id="hud" class="hide">
  <button id="pp">❚❚</button>
  <span id="time">0:00</span>
  <div id="bar"><div id="fill"></div></div>
  <span id="sec">Intro</span>
  <span class="sync"><button id="offMinus" aria-label="Matnni oldinroq">−</button><span id="off">sync 0.0s</span><button id="offPlus" aria-label="Matnni kechroq">+</button></span>
  <button id="vert">9:16</button>
  <button id="fs">⛶</button>
</div>
<div id="drop">.lrc faylni shu yerga tashlang</div>

<audio id="audio" preload="auto" playsinline webkit-playsinline></audio>
<script src="app.js"></script>
</body>
</html>
